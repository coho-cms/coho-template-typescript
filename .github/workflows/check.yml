name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # To install the @coho-cms packages from GitHub Packages (see .npmrc).
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The generated code must be exactly what the committed type model generates.
      - name: Generated code is up to date
        run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
