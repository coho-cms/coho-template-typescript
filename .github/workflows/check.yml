name: Check

# Version branches only, such as v2026.1.0: pull requests into one, and commits to one.
on:
  pull_request:
    branches: ['v*']
  push:
    branches: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # `npm install`, not `npm ci`, and no `cache: npm`: both want a committed
      # package-lock.json, and a template has none. create-coho's bundler deletes any
      # lock it finds, so a scaffolded library resolves its own tree -- pinning here
      # would test a tree nobody is given. The other four templates install unpinned
      # too, which is why this was the only template whose check never ran.
      - run: npm install
      # The generated code must be exactly what the committed type model generates.
      - name: Generated code is up to date
        run: npm run check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
